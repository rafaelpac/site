<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>links</title>
<style>
  :root {
    --bg: #fafaf9;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #dedcd4;
    --hover-bg: #1c1c1a;
    --hover-ink: #fafaf9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10vh 1.5rem 4rem;
  }

  header {
    margin-bottom: 3.5rem;
    text-align: center;
  }

  header h1 {
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: lowercase;
    margin: 0;
    color: var(--muted);
  }

  main {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  a.card {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    text-decoration: none;
    color: var(--ink);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  a.card:hover,
  a.card:focus-visible {
    background: var(--hover-bg);
    color: var(--hover-ink);
    border-color: var(--hover-bg);
  }

  a.card:focus-visible {
    outline: 2px solid var(--hover-bg);
    outline-offset: 2px;
  }

  .card .name {
    font-size: 0.95rem;
  }

  .card .note {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }

  a.card:hover .note,
  a.card:focus-visible .note {
    color: #c9c8c2;
  }

  footer {
    margin-top: 4rem;
    font-size: 0.7rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    a.card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>rafael</h1>
</header>

<main>
  <!--
    Add or remove cards freely — each is just one <a class="card">.
    The <span class="note"> is optional; delete it if you don't want a second line.
  -->
  <a class="card" href="https://rafaelpac.github.io/mancomb/" target="_blank" rel="noopener">
    <span class="name">Mancomb Seepgood</span>
    <span class="note">game</span>
  </a>

  <a class="card" href="https://rafaelpac.github.io/moisture-analyzer/" target="_blank" rel="noopener">
    <span class="name">Moisture Analyzer</span>
    <span class="note">tool</span>
  </a>

  <a class="card" href="https://rafaelpac.github.io/dietplan/" target="_blank" rel="noopener">
    <span class="name">Cardápio Semanal</span>
    <span class="note">tool</span>
  </a>

    <a class="card" href="https://hashexplained.com/" target="_blank" rel="noopener">
    <span class="name">Cryptography made visible</span>
    <span class="note">tool</span>
  </a>
</main>

<footer>
  updated 2026
</footer>

</body>
</html>
